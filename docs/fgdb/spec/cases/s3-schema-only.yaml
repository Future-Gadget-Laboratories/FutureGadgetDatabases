schema_version: 1
id: s3-schema-only
slice: S3
description: Schema restore without user rows
fixtures:
  source: fresh isolated cluster, SQL user root
variables:
  collection: nodelocal://1/par031/s3-schema-only
setup:
- 'on': source
  sql: CREATE DATABASE par031_src
- 'on': source
  sql: CREATE TABLE par031_src.public.t (id INT PRIMARY KEY, v STRING, INDEX (v))
- 'on': source
  sql: INSERT INTO par031_src.public.t VALUES (1, 'one'), (2, NULL), (3, '')
- 'on': source
  sql: BACKUP DATABASE par031_src INTO '${collection}'
statement:
  'on': source
  sql: RESTORE DATABASE par031_src FROM LATEST IN '${collection}' WITH new_db_name = 'par031_check', schema_only
expect:
  result:
    columns:
    - job_id
    - status
    - fraction_completed
    - rows
    - index_entries
    - bytes
    rows: null
    row_match: pending
    capture:
      job_id: operation_job_id
  masks:
  - field: job_id
    kind: job_id
  - field: bytes
    kind: size
post:
- 'on': source
  sql: SELECT count(*) AS n FROM par031_check.public.t
  expect:
    result:
      columns:
      - n
      rows:
      - n: 0
      row_match: exact
- 'on': source
  sql: SHOW CREATE TABLE par031_check.public.t
  expect:
    result:
      columns: null
      rows: null
      row_match: pending
  pending: Record schema output and confirm both primary and secondary index.
