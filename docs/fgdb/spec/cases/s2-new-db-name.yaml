# FGL documentation case data. Apache-2.0. Draft; not executed.
schema_version: 1
id: s2-new-db-name
slice: S2
description: Restore database under a new name while original remains
fixtures:
  source: fresh isolated cluster, SQL user root
variables:
  collection: nodelocal://1/par031/s2-new-db-name
setup:
- 'on': source
  sql: CREATE DATABASE par031_src
- 'on': source
  sql: CREATE TABLE par031_src.public.t (id INT PRIMARY KEY, v STRING, INDEX (v))
- 'on': source
  sql: INSERT INTO par031_src.public.t VALUES (1, 'one'), (2, NULL), (3, '')
- 'on': source
  sql: BACKUP DATABASE par031_src INTO '${collection}'
statement:
  'on': source
  sql: RESTORE DATABASE par031_src FROM LATEST IN '${collection}' WITH new_db_name = 'par031_copy'
expect:
  result:
    columns:
    - job_id
    - status
    - fraction_completed
    - rows
    - index_entries
    - bytes
    rows: null
    row_match: pending
    capture:
      job_id: operation_job_id
  masks:
  - field: job_id
    kind: job_id
  - field: bytes
    kind: size
post:
- 'on': source
  sql: SELECT id, v FROM par031_copy.public.t ORDER BY id
  expect:
    result:
      columns:
      - id
      - v
      rows:
      - id: 1
        v: one
      - id: 2
        v: null
      - id: 3
        v: ''
      row_match: exact
- 'on': source
  sql: SHOW EXPERIMENTAL_FINGERPRINTS FROM TABLE par031_copy.public.t
  expect:
    result:
      columns: null
      rows: null
      row_match: pending
  pending: Capture all source index fingerprints before backup and compare by index name after restore;
    exact columns await recording.
