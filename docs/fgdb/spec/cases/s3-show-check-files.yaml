schema_version: 1
id: s3-show-check-files
slice: S3
description: Inspect latest backup and validate file presence; no format inspection
fixtures:
  source: fresh isolated cluster, SQL user root
variables:
  collection: nodelocal://1/par031/s3-show-check-files
setup:
- 'on': source
  sql: CREATE DATABASE par031_src
- 'on': source
  sql: CREATE TABLE par031_src.public.t (id INT PRIMARY KEY, v STRING, INDEX (v))
- 'on': source
  sql: INSERT INTO par031_src.public.t VALUES (1, 'one'), (2, NULL), (3, '')
- 'on': source
  sql: BACKUP DATABASE par031_src INTO '${collection}'
statement:
  'on': source
  sql: SHOW BACKUP FROM LATEST IN '${collection}' WITH check_files
expect:
  result:
    columns: null
    rows: null
    row_match: pending
  masks:
  - field: end_time
    kind: timestamp
  - field: size_bytes
    kind: size
  - field: file_bytes
    kind: size
post:
- 'on': source
  sql: SELECT count(*) AS n FROM par031_src.public.t
  expect:
    result:
      columns:
      - n
      rows:
      - n: 3
      row_match: exact
