# Optional settings for fgdb-backup. Command-line flags always win.
backup:
  # A second backup with the same name waits only when this is on.
  lock: true
  lock_wait: 0s
  lock_lease: 10m
  # Zero leaves processor and memory limits unset.
  threads: 0
  memory_bytes: 0
  file_mode: "0640"
  allow_unsafe_overwrite: false
  # auto serves files through the tool; implicit is an explicit node choice.
  s3_credential_mode: auto

restore:
  # Use beside-and-swap where the preflight says it is safe.
  swap_restore: true
  # A plain restore never replaces a non-empty database. --force uses swap;
  # set in_place only for the explicit --force=in-place last resort.
  in_place: false
  retention: 1
  testing_mode: false
  threads: 0
  memory_bytes: 0
  allow_unsafe_overwrite: false
  s3_credential_mode: auto
