# Optional settings for fgdb-backup. Command-line flags always win.
backup:
  # A second backup with the same name waits only when this is on.
  lock: true
  lock_wait: 0s
  lock_lease: 10m
  # Zero leaves processor and memory limits unset.
  threads: 0
  memory_bytes: 0
  file_mode: "0640"
  allow_unsafe_overwrite: false
  # auto, specified, and served all serve files through the tool.
  # implicit asks the database node to read s3:// itself.
  s3_credential_mode: auto

restore:
  # Use beside-and-swap where the preflight says it is safe.
  swap_restore: true
  # Read only when --force is not passed. A non-empty database still needs
  # --force. --force by itself swaps. --force=in-place drops objects in place.
  in_place: false
  retention: 1
  # Creates a scratch table, copies one row, and drops the table.
  # It does not turn the S3 probe on or off.
  testing_mode: false
  threads: 0
  memory_bytes: 0
  allow_unsafe_overwrite: false
  # auto, specified, and served all serve files through the tool.
  # implicit asks the database node to read s3:// itself.
  s3_credential_mode: auto
